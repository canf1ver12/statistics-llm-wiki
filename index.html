<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計學 LLM Wiki 講義庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Caveat+Brush&family=Special+Elite&display=swap">
<style>
/* Theme tokens: keep in sync with each lesson index.html (crayon theme) */
:root{
  --desk:#dcd7cd; --paper-bg:#f3f0e9; --paper:#fbf8f1; --ink:#26221f; --muted:#6d655e; --line:#cfc8bb;
  --tomato:#b8483c; --pink:#d9858f; --peri:#7b80c6; --mustard:#e3bd52;
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif; --hand:"Noto Serif TC","Noto Sans TC",serif;
  --brush:"Caveat Brush",cursive; --type:"Special Elite",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper-bg);color:var(--ink);font-family:var(--hand);line-height:1.7;padding:56px 16px;min-height:100vh}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.brand{font-family:var(--brush);font-size:56px;line-height:1;transform:rotate(-2deg);display:inline-block}
header h1{font-family:var(--hand);font-size:32px;font-weight:900;margin-top:8px}
header h1 span{background:linear-gradient(transparent 60%,rgba(227,189,82,.7) 60%)}
header p{color:var(--muted);margin-top:8px}
h2{font-family:var(--type);font-weight:400;font-size:15px;letter-spacing:.14em;color:var(--tomato)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px;margin-top:16px}
.card{position:relative;background:var(--paper);padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:3px 5px 14px rgba(38,34,31,.16);transform:rotate(-.8deg)}
.tag{align-self:flex-start;font-family:var(--type);font-size:13px;padding:1px 10px;background:rgba(227,189,82,.45)}
.card h3{font-family:var(--hand);font-size:21px;font-weight:900}
.card p{color:var(--muted);font-size:15px}
.meta{font-family:var(--type);font-size:13px;color:var(--muted)}
.btn{align-self:flex-start;margin-top:auto;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;padding:8px 20px;border-radius:999px}
.card.soon{transform:rotate(.8deg);justify-content:center;align-items:center;color:var(--muted);font-family:var(--brush);font-size:24px;background:transparent;box-shadow:none;border:2px dashed var(--line)}
footer{color:var(--muted);font-size:14px}
footer a{color:var(--tomato)}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">Stats Notes</div>
    <h1><span>統計學 LLM Wiki 講義庫</span></h1>
    <p>以 LLM Wiki 為知識來源製作的統計學教學簡報，每份都能直接在瀏覽器打開、用方向鍵翻頁</p>
  </header>

  <section>
    <h2>LESSONS ・ 講義</h2>
    <div class="cards">
      <article class="card">
                <span class="tag">推論統計・入門</span>
        <h3>只抽一次樣本，怎麼知道整個母體？</h3>
        <p>從隨機抽樣出發，用抽樣分配和中央極限定理，一路推到信賴區間；附兩個互動模擬</p>
        <div class="meta">21 頁・← → 翻頁・2 個互動模擬</div>
        <a class="btn" href="lessons/sampling-clt-ci/">開始 →</a>
      </article>
      <div class="card soon">more coming soon</div>
    </div>
  </section>

  <footer>
    內容來源：<a href="https://github.com/canf1ver12/statistics-llm-wiki/blob/main/wiki/index.md">statistics-llm-wiki</a>，整理自課堂講義與手寫筆記
  </footer>
</main>
</body>
</html>
